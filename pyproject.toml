[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bondbench"
version = "0.1.0"
description = "A small eval harness and gold set for testing LLMs on fixed-income and fund-operations questions."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rohan Jindal" }]
requires-python = ">=3.10"
keywords = ["llm", "evaluation", "evals", "fixed income", "finance", "benchmark", "gold set"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pandas>=2.0",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
all = ["openai>=1.40", "anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
bondbench = "bondbench.cli:main"

[project.urls]
Homepage = "https://github.com/rohanjindal-pm/bondbench"
Issues = "https://github.com/rohanjindal-pm/bondbench/issues"
Changelog = "https://github.com/rohanjindal-pm/bondbench/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/bondbench"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
