name: Bug report
description: Something doesn't work or a check grades an answer wrongly
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command you ran and the output or traceback.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: grading
    attributes:
      label: If a check graded an answer wrongly
      description: Paste the question id, the model response and the grade it got. Remove anything confidential.
  - type: input
    id: version
    attributes:
      label: bondbench version
      description: Output of `bondbench --version`
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
